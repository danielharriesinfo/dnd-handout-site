<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>D&amp;D Handout</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Aldrich&display=swap" rel="stylesheet" />
<style>
  /* The public page: the stage (MainStage, 1920 x 1200) as large as fits,
     an HTML loading screen over it while the file downloads and the stage
     warms up, and the letter's text box over the Compose panel. Made to sit
     in an iframe (Wix's "Embed a site") as well as on its own.
     Share links (share-links.js): opens a shared letter in the Share View,
     keeps a real-text copy of it for screen readers, and turns the Share
     button into a link; dev/share/README.md has the design. */
  :root { --bg: #0d0b0a; --gold: #f2c46e; --label: #d9c7a3; --track: #1e2229; --rim: #8a6a3a; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { display: grid; place-items: center; }

  #stage { position: relative; width: min(100vw, 160vh); aspect-ratio: 1920 / 1200;
           container-type: inline-size; }
  #canvas { display: block; width: 100%; height: 100%; }

  /* Compose's writing panel: artboard x 85-514, y 318-605, the box inset 12 */
  #letterInput {
    position: absolute; display: none; box-sizing: border-box; resize: none;
    opacity: 0; transition: opacity 0.15s ease-out;
    left: calc(97 / 1920 * 100%); top: calc(330 / 1200 * 100%);
    width: calc(405 / 1920 * 100%); height: calc(263 / 1200 * 100%);
    padding: 0.6cqw; border: 0; outline: 0; background: transparent;
    color: #e9dfc9; caret-color: var(--gold);
    font: 1.05cqw/1.45 "Aldrich", system-ui, sans-serif; letter-spacing: 0.04em;
  }
  #letterInput::placeholder { color: #8d8270; }
  /* Deliver > Address: placed by the page from the frame's box in the file */
  #addressInput {
    position: absolute; display: none; box-sizing: border-box; resize: none; overflow: hidden;
    opacity: 0; transition: opacity 0.15s ease-out;
    padding: 0.3cqw 0.6cqw; border: 0; outline: 0; background: transparent;
    color: #e9dfc9; caret-color: var(--gold);
    font: 1.05cqw/1.45 "Aldrich", system-ui, sans-serif; letter-spacing: 0.04em;
  }
  #addressInput::placeholder { color: #8d8270; }

  /* The letter as real text, for screen readers (the stage's own text panel
     is drawn, so they can't read it), text search and translation. */
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
             clip: rect(0 0 0 0); white-space: pre-wrap; border: 0; }

  /* After Share: the link, to copy by hand if the browser blocked copying.
     Sits under the menu (artboard x 60-540, above y 1140). */
  #shareBox { position: absolute; left: calc(60 / 1920 * 100%); bottom: calc(60 / 1200 * 100%);
              width: calc(480 / 1920 * 100%); display: none; box-sizing: border-box; padding: 0.7cqw;
              background: #1e2229ee; border: 1.5px solid #ff991f80; border-radius: 0.4cqw;
              font: 0.8cqw "Aldrich", system-ui, sans-serif; letter-spacing: 0.05em; color: var(--label); }
  #shareBox.open { display: grid; gap: 0.5cqw; }
  #shareBox input { width: 100%; box-sizing: border-box; font: inherit; color: #e9dfc9;
                    background: var(--bg); border: 1px solid var(--rim); padding: 0.35cqw; }
  #shareBox .row { display: flex; gap: 0.5cqw; justify-content: flex-end; }
  #shareBox button { font: inherit; letter-spacing: 0.1em; color: var(--label); background: var(--bg);
                     border: 1px solid var(--rim); padding: 0.3cqw 0.8cqw; cursor: pointer; }

  /* The loading screen: the same look as the one in the file (which sits
     under this and fades with it), with motion the browser keeps running
     while the stage stalls: a flickering glow and a shimmer on the bar. */
  #loader { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
            background: var(--bg); transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1); }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader .glow { position: absolute; width: 58vmax; height: 34vmax; border-radius: 50%;
                  background: radial-gradient(closest-side, #3a2414 0%, #2a1a0e 45%, transparent 100%);
                  animation: flicker 3.2s ease-in-out infinite; will-change: opacity, transform; }
  #loader .box { position: relative; display: grid; justify-items: center; gap: 22px; }
  #loader .label { font: 20px "Aldrich", system-ui, sans-serif; letter-spacing: 6px; color: var(--label);
                   animation: breathe 2.4s ease-in-out infinite; }
  #loader .track { position: relative; width: 496px; max-width: 70vw; height: 16px; box-sizing: border-box;
                   border: 1.5px solid var(--rim); border-radius: 8px; background: var(--track); overflow: hidden; }
  #loader .fill { position: absolute; left: 6px; right: 6px; top: 50%; height: 6px; margin-top: -3px;
                  border-radius: 3px; background: var(--gold); box-shadow: 0 0 10px #f0b45a99;
                  transform-origin: left center; transform: scaleX(0); transition: transform 0.35s ease-out; }
  #loader .shine { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, #fff3d455, transparent);
                   width: 30%; animation: shine 1.8s ease-in-out infinite; will-change: transform; }
  #loader .note { font: 13px "Aldrich", system-ui, sans-serif; letter-spacing: 2px; color: #8d8270;
                  max-width: 70vw; text-align: center; min-height: 1em; }
  @keyframes flicker { 0%, 100% { opacity: 1; transform: scale(1); } 30% { opacity: 0.86; transform: scale(0.985); }
                       55% { opacity: 0.95; transform: scale(1.01); } 75% { opacity: 0.88; transform: scale(0.995); } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  @keyframes shine { from { transform: translateX(-110%); } to { transform: translateX(370%); } }
  @media (prefers-reduced-motion: reduce) { #loader .glow, #loader .label, #loader .shine { animation: none; } }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="canvas" role="img" aria-label="A letter on the desk"></canvas>
    <textarea id="letterInput" placeholder="Write your letter…" aria-label="Your letter"></textarea>
    <textarea id="addressInput" maxlength="90" rows="4" placeholder="To whom, and where…" aria-label="The address"></textarea>
    <article id="letterText" class="sr-only" aria-label="The letter" hidden></article>
    <div id="shareBox" role="dialog" aria-label="Link to your letter">
      <span class="message" aria-live="polite"></span>
      <input type="text" readonly aria-label="Link" />
      <div class="row"><button type="button" class="copy">COPY</button><button type="button" class="close">CLOSE</button></div>
    </div>
  </div>

  <div id="loader" role="status" aria-live="polite">
    <div class="glow"></div>
    <div class="box">
      <div class="label">PREPARING YOUR DESK</div>
      <div class="track"><div class="fill"></div><div class="shine"></div></div>
      <div class="note"></div>
    </div>
  </div>

  <script src="https://unpkg.com/@rive-app/webgl2@2.43.1"></script>
  <script src="share-links.js"></script>
  <script>
    const PARAMS = new URLSearchParams(location.search);
    const RIV = "dnd-quill.riv";
    const RIV_BYTES = 15401051; // its size, for the bar (hosts may send it compressed); set by tools/publish_site.sh
    const STATE_MACHINE = "State Machine 1";
    const DOWNLOAD_SHARE = 0.6; // of the bar: downloading the file, then the stage warming up
    const PARENT_WAIT = 2500; // ms to wait for a Wix page to answer before going it alone

    const canvas = document.getElementById("canvas");
    const letterInput = document.getElementById("letterInput");
    const letterText = document.getElementById("letterText");
    // Compose's writing field waits until the panel's background has opened (Menu1's
    // 200 ms blend), coming in a touch before it settles, then fades in; it hides at once.
    const FIELD_DELAY_MS = 250;
    function fieldShower(el) {
      let since = null;
      return (open, now) => {
        if (!open) since = null;
        else if (since === null) since = now;
        const shown = open && now - since >= FIELD_DELAY_MS;
        el.style.display = shown ? "block" : "none";
        el.style.opacity = shown && now - since >= FIELD_DELAY_MS + 20 ? "1" : "0";
      };
    }
    const showField = fieldShower(letterInput);
    // Deliver > Address's field, the same way. Its frame sits wherever the menu's
    // layout puts it, so the file reports its box (VMMainStage addressFieldX..H,
    // stage px) and the textarea follows, inset to the frame's dark interior. The
    // address is kept short: the scroll's tag is the smallest place it's drawn.
    const addressInput = document.getElementById("addressInput");
    const showAddress = fieldShower(addressInput);
    const ADDRESS_MAX_LINES = 4;
    const ADDRESS_INSET = { x: 34, y: 18 };
    const ADDRESS_FONT = 16; // stage px, so four lines fit the frame at any size
    function placeAddress(x, y, w, h) {
      const scale = addressInput.parentElement.clientWidth / 1920;
      addressInput.style.fontSize = `${ADDRESS_FONT * scale}px`;
      addressInput.style.lineHeight = "1.3";
      addressInput.style.padding = `${4 * scale}px ${10 * scale}px`;
      addressInput.style.left = `${((x + ADDRESS_INSET.x) / 1920) * 100}%`;
      addressInput.style.top = `${((y + ADDRESS_INSET.y) / 1200) * 100}%`;
      addressInput.style.width = `${((w - 2 * ADDRESS_INSET.x) / 1920) * 100}%`;
      addressInput.style.height = `${((h - 2 * ADDRESS_INSET.y) / 1200) * 100}%`;
    }
    // at most ADDRESS_MAX_LINES lines (maxlength on the element caps the characters)
    addressInput.addEventListener("beforeinput", (e) => {
      if ((e.inputType === "insertLineBreak" || e.inputType === "insertParagraph")
          && addressInput.value.split("\n").length >= ADDRESS_MAX_LINES) e.preventDefault();
    });
    function clampAddress() {
      const lines = addressInput.value.split("\n");
      if (lines.length > ADDRESS_MAX_LINES) addressInput.value = lines.slice(0, ADDRESS_MAX_LINES).join("\n");
      return addressInput.value;
    }
    // the file's address fields, looked up once the file is loaded
    function addressBinding(vm) {
      const open = vm.boolean("addressOpen");
      const box = ["X", "Y", "W", "H"].map((k) => vm.number(`addressField${k}`));
      const address = vm.viewModel("address");
      const text = address && address.string("addressText");
      if (text) addressInput.value = text.value;
      addressInput.addEventListener("input", () => { const v = clampAddress(); if (text) text.value = v; });
      return (now, allowed) => {
        const on = allowed && !!open && open.value && box.every(Boolean) && box[3].value > 0;
        if (on) placeAddress(box[0].value, box[1].value, box[2].value, box[3].value);
        showAddress(on, now);
      };
    }
    const loader = document.getElementById("loader");
    const fill = loader.querySelector(".fill");
    const note = loader.querySelector(".note");
    const S = window.HandoutShare;

    let shown = 0;
    function setProgress(p) {
      shown = Math.max(shown, Math.min(1, p));
      fill.style.transform = `scaleX(${shown})`;
    }
    function fail(message) {
      loader.querySelector(".shine").style.display = "none";
      note.textContent = message;
    }

    // Canvas resolution: the screen's own density (max 2), as sharp as it
    // looks locally. Only if the stage struggles (under SLOW_FPS for 3 s,
    // judged from 5 s after the loading screen goes) does it step down a
    // level, never below 1 pixel per CSS pixel; it steps back up once frames
    // have headroom again (and not to a level that proved too slow in the last
    // 30 s). ?dpr=1.5 etc. in the address fixes the level instead.
    // (Daniel's Iris Xe laptop, 1.5x screen, full-width embed: 1.5x ~19 fps,
    // 1.25x ~24, 1x ~28, so it settles at 1.25x.)
    const SLOW_FPS = 22, FAST_FPS = 50;
    const fixedDpr = parseFloat(PARAMS.get("dpr")) || 0;
    const screenDpr = Math.max(1, Math.min(devicePixelRatio || 1, 2));
    const dpr = { levels: fixedDpr > 0 ? [fixedDpr] : [1, 1.25, 1.5, 1.75, 2].filter((l) => l <= screenDpr + 0.01),
                  index: 0, frames: 0, since: 0, last: 0, good: 0, bad: 0, slowUntil: {}, from: 0 };
    dpr.index = dpr.levels.length - 1;
    window.handoutDpr = dpr; // for checking from the console
    function resize(r) { r.resizeDrawingSurfaceToCanvas(dpr.levels[dpr.index]); }
    // A new level: the first frames after a resize are slow, so it settles
    // 1.5 s before being judged.
    function setLevel(r, index, now) {
      dpr.index = index; dpr.good = dpr.bad = 0; dpr.since = 0; dpr.from = now + 1500;
      resize(r);
    }
    // Frame rates are judged over 1.5 s windows (shorter ones are too noisy).
    function adapt(r, now) {
      if (now < dpr.from) return;
      const gap = now - dpr.last; dpr.last = now;
      if (!dpr.since || gap > 250) { dpr.since = now; dpr.frames = 0; return; } // hidden or stalled: don't judge
      dpr.frames++;
      if (now - dpr.since < 1500) return;
      const fps = (dpr.frames * 1000) / (now - dpr.since);
      dpr.fps = Math.round(fps);
      dpr.since = now; dpr.frames = 0;
      if (fixedDpr > 0) return; // measured, not changed
      dpr.good = fps >= FAST_FPS ? dpr.good + 1 : 0;
      dpr.bad = fps < SLOW_FPS ? dpr.bad + 1 : 0;
      if (dpr.bad >= 2 && dpr.index > 0) { dpr.slowUntil[dpr.index] = now + 30000; setLevel(r, dpr.index - 1, now); }
      else if (dpr.good >= 2 && dpr.index + 1 < dpr.levels.length && !(dpr.slowUntil[dpr.index + 1] > now)) setLevel(r, dpr.index + 1, now);
    }

    // Downloads the file with progress (the first part of the bar). The bytes
    // arrive decompressed, so a compressed Content-Length can't size the bar:
    // the file's own size (RIV_BYTES) does.
    async function download(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const total = RIV_BYTES || +res.headers.get("Content-Length") || 0;
      if (!res.body || !total) return res.arrayBuffer();
      const reader = res.body.getReader();
      const chunks = [];
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        got += value.length;
        setProgress(Math.min(got / total, 1) * DOWNLOAD_SHARE);
      }
      return new Blob(chunks).arrayBuffer();
    }

    // ---- share links ------------------------------------------------------
    // site: the Wix page around this one (null when there isn't one).
    // incoming: the shared letter this page was opened with, or null.
    const share = { site: null, incoming: null };
    const shareReady = (async () => {
      share.site = await S.connect(PARENT_WAIT);
      const code = S.codeInAddress();
      if (code) share.incoming = await S.fromCode(code);
      else if (share.site) share.incoming = await share.site.letter;
      window.handoutShare = share; // for checking from the console
    })();

    async function start() {
      if (!document.createElement("canvas").getContext("webgl2")) {
        fail("This handout needs WebGL 2. Try a recent Chrome, Edge, Firefox or Safari.");
        return;
      }
      let buffer;
      try {
        [buffer] = await Promise.all([download(RIV), shareReady]);
      } catch (e) {
        console.error(e);
        fail("Couldn't load the handout. Please refresh the page.");
        return;
      }
      setProgress(DOWNLOAD_SHARE);
      const r = new rive.Rive({
        buffer, canvas, artboard: "MainStage", stateMachines: STATE_MACHINE,
        autoplay: true, autoBind: true,
        // the 3D models and backgrounds draw through script canvases: experimental
        // in the web runtime, so switched on here
        enableGPUCanvas: true,
        layout: new rive.Layout({ fit: rive.Fit.contain, alignment: rive.Alignment.center }),
        onLoad: () => wire(r),
        onLoadError: (e) => { console.error(e); fail("Couldn't start the handout. Please refresh the page."); },
      });
      window.handout = r;
      addEventListener("resize", () => resize(r));
    }

    // Shows a shared letter: on the stage (Share View, paper open) and as
    // real text for screen readers.
    function openShared(vm, payload) {
      if (!S.apply(vm, payload)) return false;
      const flag = vm.boolean("shareView");
      if (flag) flag.value = true;
      const open = vm.boolean("paperOpen");
      if (open) open.value = true;
      letterText.textContent = payload.text;
      letterText.hidden = false;
      canvas.setAttribute("aria-label", "A letter on the desk. Its text follows.");
      return true;
    }

    // "Write your own": the stage has left the Share View; start a fresh letter
    // in the same style, and drop the shared letter from the address.
    function leaveShared(vm) {
      const letter = vm.viewModel("propertyOfLetter1");
      if (letter) letter.string("letterContents").value = "";
      letterInput.value = "";
      letterText.hidden = true;
      letterText.textContent = "";
      canvas.setAttribute("aria-label", "A letter on the desk");
      if (S.codeInAddress()) history.replaceState(null, "", location.href.split("#")[0]);
      if (share.site) share.site.leave();
    }

    // The Share button: store the letter (Wix) or pack it into the link (on
    // its own), copy the link, and say how it went on the button.
    const shareBox = document.getElementById("shareBox");
    const shareInput = shareBox.querySelector("input");
    shareBox.querySelector(".close").addEventListener("click", () => shareBox.classList.remove("open"));
    shareBox.querySelector(".copy").addEventListener("click", async () => {
      shareInput.select();
      shareBox.querySelector(".message").textContent = (await S.copy(shareInput.value)) ? "Copied." : "Select the link and copy it.";
    });
    // url "" shows the message alone (a save that was refused)
    function showLink(url, message) {
      shareInput.value = url;
      shareInput.hidden = shareBox.querySelector(".copy").hidden = !url;
      shareBox.querySelector(".message").textContent = message;
      shareBox.classList.add("open");
    }

    let sharing = false;
    async function shareLetter(vm, button) {
      if (sharing) return;
      sharing = true;
      const state = button.number("shareState");
      const set = (s) => { if (state) state.value = s; };
      set(S.STATE.saving);
      try {
        const payload = S.read(vm);
        if (!payload) throw new Error("no letter on the stage");
        let url, copied;
        if (share.site && share.site.canSave) {
          ({ url, copied } = await share.site.save(payload));
        } else {
          url = S.inlineLink(await S.toCode(payload));
          copied = await S.copy(url);
        }
        set(copied ? S.STATE.copied : S.STATE.shown);
        showLink(url, copied ? "Link copied. Anyone with it can read this letter." : "Copy this link to share your letter.");
      } catch (e) {
        console.error("share", e);
        set(S.STATE.failed);
        // the Velo backend's own refusals are sentences meant for people
        // (the save limit); anything else (a Wix error code, no answer) isn't
        const reason = String((e && e.message) || "");
        showLink("", /^[A-Z][^:]*\.$/.test(reason) ? reason : "Couldn't save the letter just now. Please try again in a moment.");
      }
      setTimeout(() => { set(S.STATE.idle); sharing = false; }, 3500);
    }

    function wire(r) {
      resize(r);
      const vm = r.viewModelInstance;
      if (!vm) { loader.classList.add("done"); return; }
      const ready = vm.boolean("stageReady");
      const progress = vm.number("loadProgress");
      const menuID = vm.number("menuID");
      const shareView = vm.boolean("shareView");
      const letter = vm.viewModel("propertyOfLetter1");
      const letterString = letter && letter.string("letterContents");
      const button = S.shareButton(vm);
      const requested = button && button.boolean("shareRequested");
      if (!shareView || !button) console.warn("this .riv has no share view (shareView, Share button)");

      // Compose's position in the menu list (spacers take positions too)
      let compose = -1;
      try {
        const list = vm.list("menuList");
        for (let i = 0; i < list.length; i++) {
          const title = list.instanceAt(i).string("title");
          if (title && title.value === "Compose") compose = i;
        }
      } catch (e) { console.warn("menuList", e); }

      letterInput.addEventListener("input", () => { if (letterString) letterString.value = letterInput.value; });
      const showAddressField = addressBinding(vm);

      let inShare = share.incoming ? openShared(vm, share.incoming) : false;
      if (S.codeInAddress() && !share.incoming) note.textContent = "That link's letter couldn't be read.";

      let loading = true;
      (function frame(now) {
        if (loading) {
          setProgress(DOWNLOAD_SHARE + (progress ? progress.value : 1) * (1 - DOWNLOAD_SHARE));
          if (!ready || ready.value) {
            loading = false;
            dpr.from = now + 5000; // the intro (the heaviest seconds) plays out first
            setProgress(1);
            loader.classList.add("done");
            setTimeout(() => (loader.style.display = "none"), 800);
          }
        }
        if (inShare && shareView && !shareView.value) { inShare = false; leaveShared(vm); }
        if (requested && requested.value) { requested.value = false; shareLetter(vm, button); }
        showField(!inShare && compose >= 0 && menuID && menuID.value === compose, now);
        showAddressField(now, !inShare);
        if (!loading) adapt(r, now);
        requestAnimationFrame(frame);
      })(performance.now());
    }

    start();
  </script>
</body>
</html>
